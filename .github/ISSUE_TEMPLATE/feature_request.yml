name: Feature Request
description: Suggest another plugin, architecture or distribution target
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Requests for new plugin functionality belong
        [upstream](https://gitlab.freedesktop.org/gstreamer/gst-plugins-rs/-/issues).
        Use this form to ask for something this repository packages or ships.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not do today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: "For example: build another gst-plugin-* crate, add an architecture, or target another distribution."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: textarea
    id: context
    attributes:
      label: Additional context
