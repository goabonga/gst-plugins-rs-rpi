# Dependabot v2 configuration.
#
# This repository has no application dependencies of its own -- the plugins are
# compiled from an upstream checkout whose version the upstream-watch workflow
# tracks. What Dependabot maintains here is the pipeline itself: the pinned
# GitHub Actions, including the container actions referenced as docker://.

version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    groups:
      ci-actions:
        applies-to: version-updates
        patterns:
          - "actions/*"
          - "docker/*"
          - "dtolnay/*"
          - "softprops/*"
          - "rhysd/*"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"

