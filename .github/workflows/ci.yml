name: ci

# Pull requests run the same pipeline a release does, minus the publishing
# stages: checks, then the newest stable upstream version resolved from
# GitLab, then the packaging metadata, then both architectures built and
# verified.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: pipeline
    uses: ./.github/workflows/pipeline.yml
