name: release

# The full pipeline plus the publishing stages:
#
#   checks -> version -> metadata -> build -> github release -> launchpad, aur
#
# The first four stages are the same reusable pipeline pull requests run, so
# nothing is ever published from a tree that would fail CI.
#
# Callable three ways:
#   - `workflow_call` from upstream-watch.yml, right after it found a new
#     upstream release (a tag pushed with GITHUB_TOKEN does not start another
#     workflow, so the watcher calls this one directly);
#   - a `v*` tag pushed by hand;
#   - `workflow_dispatch`, defaulting to the newest stable upstream release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Upstream tag to build (e.g. gstreamer-1.28.6); empty = newest stable'
        required: false
        default: ''
      revision:
        description: 'Packaging revision: bump to re-release the same upstream version with fixed packaging'
        required: false
        default: '1'
  workflow_call:
    inputs:
      upstream_tag:
        description: 'Upstream tag to build (e.g. gstreamer-1.28.6)'
        type: string
        required: true
      tag:
        description: 'Release tag to publish (e.g. v1.28.6)'
        type: string
        required: true
      revision:
        description: 'Packaging revision'
        type: string
        required: false
        default: '1'

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  pipeline:
    name: pipeline
    uses: ./.github/workflows/pipeline.yml
    with:
      upstream_tag: ${{ inputs.upstream_tag }}
      tag: ${{ inputs.tag }}
      revision: ${{ inputs.revision || '1' }}

  gate:
    name: publishing targets
    runs-on: ubuntu-latest
    outputs:
      launchpad: ${{ steps.gate.outputs.launchpad }}
      aur: ${{ steps.gate.outputs.aur }}
    steps:
      - name: Decide which downstream publishers can run
        id: gate
        env:
          # `secrets` is not readable from a job-level `if`, so the decision is
          # made here and exposed as an output the other jobs can gate on.
          LAUNCHPAD_GPG_PRIVATE_KEY: ${{ secrets.LAUNCHPAD_GPG_PRIVATE_KEY }}
          LAUNCHPAD_PPA: ${{ vars.LAUNCHPAD_PPA }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          launchpad=false
          if [ -n "$LAUNCHPAD_GPG_PRIVATE_KEY" ] && [ -n "$LAUNCHPAD_PPA" ]; then
            launchpad=true
          fi
          aur=false
          if [ -n "$AUR_SSH_PRIVATE_KEY" ]; then
            aur=true
          fi
          {
            echo "launchpad=$launchpad"
            echo "aur=$aur"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Downstream publishing"
            echo ""
            echo "| Target | Enabled | Requires |"
            echo "| --- | --- | --- |"
            echo "| Launchpad PPA | \`$launchpad\` | \`LAUNCHPAD_GPG_PRIVATE_KEY\` secret + \`LAUNCHPAD_PPA\` variable |"
            echo "| AUR | \`$aur\` | \`AUR_SSH_PRIVATE_KEY\` secret |"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: github release
    needs: [pipeline]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist

      - name: Generate checksums
        run: |
          cd dist
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.pipeline.outputs.tag }}
          name: ${{ needs.pipeline.outputs.tag }}
          body: |
            Pre-built GStreamer Rust WebRTC plugins from upstream
            [`${{ needs.pipeline.outputs.upstream_tag }}`](https://gitlab.freedesktop.org/gstreamer/gst-plugins-rs/-/tree/${{ needs.pipeline.outputs.upstream_tag }}).

            | Artifact | Target |
            | --- | --- |
            | `gst-plugins-rs-webrtc_${{ needs.pipeline.outputs.version }}-${{ needs.pipeline.outputs.revision }}_amd64.deb` | Debian/Ubuntu x86-64 |
            | `gst-plugins-rs-webrtc_${{ needs.pipeline.outputs.version }}-${{ needs.pipeline.outputs.revision }}_arm64.deb` | Debian/Ubuntu arm64 (Raspberry Pi 64-bit) |
            | `gst-plugins-rs-webrtc-${{ needs.pipeline.outputs.version }}-<arch>.tar.gz` | any distribution |

            `SHA256SUMS` covers every asset.
          files: dist/*
          make_latest: true

  launchpad:
    name: launchpad ppa
    needs: [pipeline, publish, gate]
    if: needs.gate.outputs.launchpad == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debhelper devscripts dput dpkg-dev

      - name: Import the signing key
        env:
          LAUNCHPAD_GPG_PRIVATE_KEY: ${{ secrets.LAUNCHPAD_GPG_PRIVATE_KEY }}
          LAUNCHPAD_GPG_PASSPHRASE: ${{ secrets.LAUNCHPAD_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gnupg"
          chmod 700 "$HOME/.gnupg"
          # dpkg-buildpackage drives gpg non-interactively, so the agent has to
          # accept a passphrase supplied on the command line and keep it for
          # the whole upload run.
          printf 'allow-loopback-pinentry\ndefault-cache-ttl 7200\nmax-cache-ttl 7200\n' \
            > "$HOME/.gnupg/gpg-agent.conf"
          printf 'pinentry-mode loopback\n' > "$HOME/.gnupg/gpg.conf"
          gpgconf --kill gpg-agent || true
          echo "$LAUNCHPAD_GPG_PRIVATE_KEY" | gpg --batch --import
          # Prime the agent cache so the signing steps below need no prompt.
          echo priming | gpg --batch --yes --passphrase "$LAUNCHPAD_GPG_PASSPHRASE" \
            --pinentry-mode loopback --sign > /dev/null

      - name: Build and upload the source package
        env:
          LAUNCHPAD_PPA: ${{ vars.LAUNCHPAD_PPA }}
          LAUNCHPAD_SERIES: ${{ vars.LAUNCHPAD_SERIES }}
        run: |
          scripts/publish-launchpad.sh \
            --version '${{ needs.pipeline.outputs.version }}' \
            --revision '${{ needs.pipeline.outputs.revision }}' \
            --ppa "$LAUNCHPAD_PPA" \
            --series "${LAUNCHPAD_SERIES:-noble}"

      - name: Summarise
        run: |
          {
            echo "### Launchpad"
            echo ""
            echo "Uploaded \`gst-plugins-rs-webrtc ${{ needs.pipeline.outputs.version }}\` to \`${{ vars.LAUNCHPAD_PPA }}\`."
            echo ""
            echo "Launchpad emails the build result; packages appear once its builders finish."
          } >> "$GITHUB_STEP_SUMMARY"

  aur:
    name: aur
    needs: [pipeline, publish, gate]
    if: needs.gate.outputs.aur == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - gst-plugins-rs-webrtc
          - gst-plugins-rs-webrtc-bin
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist

      - name: Configure the AUR SSH key
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$HOME/.ssh/aur"
          chmod 600 "$HOME/.ssh/aur"

      - name: Render and push the package
        run: |
          set -euo pipefail
          # makepkg is the only supported .SRCINFO generator and it refuses to
          # run as root, so publishing happens as an unprivileged user inside
          # an Arch container.
          docker run --rm \
            -v "$PWD:/work" \
            -v "$HOME/.ssh:/ssh:ro" \
            -w /work \
            -e "PACKAGE=${{ matrix.package }}" \
            -e "VERSION=${{ needs.pipeline.outputs.version }}" \
            archlinux:base-devel \
            scripts/aur-container-entrypoint.sh --pkgrel '${{ needs.pipeline.outputs.revision }}'

      - name: Summarise
        run: |
          {
            echo "### AUR"
            echo ""
            echo "Pushed \`${{ matrix.package }} ${{ needs.pipeline.outputs.version }}\` to <https://aur.archlinux.org/packages/${{ matrix.package }}>."
          } >> "$GITHUB_STEP_SUMMARY"
