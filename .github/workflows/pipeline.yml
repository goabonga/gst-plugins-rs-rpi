name: pipeline

# The build pipeline, in the order the work actually depends on:
#
#   checks -> version -> metadata -> build
#
#   checks    static gates that need nothing external (lint, SPDX headers)
#   version   ask GitLab which stable upstream release is the newest
#   metadata  render and validate the packaging metadata for that version,
#             so a broken control file or PKGBUILD fails in two minutes
#             instead of after a twenty-minute arm64 compile
#   build     compile the plugins, package them, prove they load
#
# Reusable so that pull requests and releases run exactly the same pipeline;
# release.yml adds the publishing stages after it.

on:
  workflow_call:
    inputs:
      upstream_tag:
        description: 'Upstream tag to build (e.g. gstreamer-1.28.6); empty = newest stable'
        type: string
        required: false
        default: ''
      tag:
        description: 'Release tag this build belongs to (e.g. v1.28.6); empty = derived'
        type: string
        required: false
        default: ''
    outputs:
      version:
        description: 'Upstream version being built, e.g. 1.28.6'
        value: ${{ jobs.version.outputs.version }}
      tag:
        description: 'Release tag for this version, e.g. v1.28.6'
        value: ${{ jobs.version.outputs.tag }}
      upstream_tag:
        description: 'Upstream tag being built, e.g. gstreamer-1.28.6'
        value: ${{ jobs.version.outputs.upstream_tag }}

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint shell scripts
        run: shellcheck scripts/*.sh

      - name: Lint workflows
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  license-headers:
    name: license headers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check SPDX headers
        run: python3 scripts/add_license_header.py --path . --types sh,yml,yaml,py --check

  version:
    name: resolve version
    needs: [lint, license-headers]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      upstream_tag: ${{ steps.resolve.outputs.upstream_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ask GitLab for the newest stable upstream release
        id: upstream
        if: inputs.upstream_tag == '' && github.ref_type != 'tag'
        run: scripts/check-upstream.sh --current ''

      - name: Resolve the version to build
        id: resolve
        env:
          INPUT_UPSTREAM_TAG: ${{ inputs.upstream_tag }}
          INPUT_TAG: ${{ inputs.tag }}
          NEWEST_UPSTREAM_TAG: ${{ steps.upstream.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          upstream_tag="$INPUT_UPSTREAM_TAG"
          tag="$INPUT_TAG"

          if [ -z "$upstream_tag" ] && [ "$GITHUB_REF_TYPE" = 'tag' ]; then
            tag="$GITHUB_REF_NAME"
            upstream_tag="gstreamer-${tag#v}"
          fi
          [ -n "$upstream_tag" ] || upstream_tag="$NEWEST_UPSTREAM_TAG"

          if [ -z "$upstream_tag" ]; then
            echo "error: could not resolve an upstream tag to build" >&2
            exit 1
          fi

          version="${upstream_tag#gstreamer-}"
          [ -n "$tag" ] || tag="v$version"

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "upstream_tag=$upstream_tag"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Version"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| upstream tag | \`$upstream_tag\` |"
            echo "| version | \`$version\` |"
            echo "| release tag | \`$tag\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  metadata:
    name: packaging metadata
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debhelper devscripts dpkg-dev lintian

      - name: Build the Debian source package
        run: |
          set -euo pipefail
          # The real .so come from the build stage, which has not run yet; the
          # source package only lays them out, so placeholders exercise every
          # packaging step at the version actually being released.
          version='${{ needs.version.outputs.version }}'
          mkdir -p stub/lib/gstreamer-1.0 dist
          : > stub/lib/gstreamer-1.0/libgstrswebrtc.so
          for arch in amd64 arm64; do
            tar -czf "dist/gst-plugins-rs-webrtc-$version-$arch.tar.gz" -C stub lib
          done
          scripts/build-source-package.sh --version "$version" --series noble --with-orig

      - name: Lint the source package (informational)
        continue-on-error: true
        run: lintian build/source/noble/*.dsc

      - name: Render the source AUR package
        run: |
          set -euo pipefail
          # Only the from-source PKGBUILD can be rendered here: its checksum is
          # of the upstream tarball. The -bin one checksums artifacts this
          # pipeline has not built yet, so the aur job renders that one.
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            -e 'PACKAGE=gst-plugins-rs-webrtc' \
            -e 'VERSION=${{ needs.version.outputs.version }}' \
            archlinux:base-devel \
            scripts/aur-container-entrypoint.sh --dry-run

      - name: Check the binary package control template
        run: |
          grep -q '^Package: @PACKAGE@$' packaging/deb/control.in

      - name: Upload the rendered metadata
        uses: actions/upload-artifact@v7
        with:
          name: packaging-metadata
          path: |
            build/source/noble/*.dsc
            build/source/noble/gst-plugins-rs-webrtc-*/debian/
            build/aur/*/PKGBUILD
            build/aur/*/.SRCINFO
          if-no-files-found: error

  build:
    name: build (${{ matrix.arch }})
    needs: [version, metadata]
    # arm64 is this project's reason to exist, so it is built on every run, on
    # a native runner: cross-compiling needs a full foreign-arch sysroot, which
    # is what every earlier iteration of this pipeline broke on.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            libglib2.0-dev \
            libssl-dev \
            libsoup-3.0-dev \
            libnice-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build the plugins
        run: |
          scripts/build-plugins.sh \
            --upstream-tag '${{ needs.version.outputs.upstream_tag }}' \
            --version '${{ needs.version.outputs.version }}'

      - name: Build the .deb
        run: |
          scripts/build-deb.sh \
            --version '${{ needs.version.outputs.version }}' \
            --tarball "dist/gst-plugins-rs-webrtc-${{ needs.version.outputs.version }}-${{ matrix.arch }}.tar.gz"

      - name: Verify the plugins load
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends gstreamer1.0-tools
          # Install through apt, not dpkg -i, so the package's own Depends and
          # Recommends are resolved: this is what a user runs, and it proves
          # the declared dependencies are both correct and installable.
          sudo apt-get install -y ./dist/*.deb
          # whipsink instantiates webrtcbin while being inspected, so this
          # aborts outright if gstreamer1.0-plugins-bad is not pulled in.
          gst-inspect-1.0 webrtcsink
          gst-inspect-1.0 whipsink

      - name: Upload the packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
